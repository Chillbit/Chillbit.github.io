<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counter</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    background: #121212;
    color: #ffffff;
    font-family:
        Inter,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

.container {
    width: min(95vw, 600px);
    height: 95vh;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.display {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    margin-bottom: 40px;
}

#secondaryCounter {
    color: #00e676;

    font-size: clamp(4rem, 10vw, 5rem);
    font-weight: 900;

    margin-bottom: 12px;

    text-shadow:
        0 0 12px rgba(0, 230, 118, 0.35),
        0 0 24px rgba(0, 230, 118, 0.2);
}

#counter {
    font-size: clamp(10rem, 30vw, 16rem);
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: -0.03em;
}

.controls {
    width: 100%;

    display: flex;
    flex-direction: column;

    gap: 24px;
}

button {
    border: none;
    border-radius: 32px;

    color: white;

    font-weight: 900;

    cursor: pointer;

    transition:
        transform 0.1s ease,
        filter 0.15s ease;
}

button:hover {
    filter: brightness(1.1);
}

button:active {
    transform: scale(0.97);
}

.plus {
    background: #3F6B43;
    height: 160px;
    font-size: 6rem;
}

.minus {
    background: #7A3D3D;
    height: 160px;
    font-size: 6rem;
}

.reset {
    background: #454545;
    height: 90px;
    font-size: 2rem;
    text-transform: uppercase;
    letter-spacing: 2px;
}
</style>
</head>
<body>

<div class="container">

    <div class="display">
        <div id="secondaryCounter">$0.00</div>
        <div id="counter">0</div>
    </div>

    <div class="controls">
        <button class="plus" onclick="changeCount(1)">+</button>
        <button class="minus" onclick="changeCount(-1)">−</button>
        <button class="reset" onclick="resetCount()">Reset</button>
    </div>

</div>

<script>
let count = 0;
let earnings = 0;

const counterDisplay = document.getElementById("counter");
const earningsDisplay = document.getElementById("secondaryCounter");

function saveState() {
    localStorage.setItem("counter_value", count);
    localStorage.setItem("earnings_value", earnings);
}

function loadState() {
    const savedCount = localStorage.getItem("counter_value");
    const savedEarnings = localStorage.getItem("earnings_value");

    if (savedCount !== null) {
        count = parseInt(savedCount, 10);
    }

    if (savedEarnings !== null) {
        earnings = parseFloat(savedEarnings);
    }
}

function updateDisplay() {
    if (count === 0) {
        earnings = 0;
    }

    counterDisplay.textContent = count;
    earningsDisplay.textContent = "$" + earnings.toFixed(2);

    saveState();
}

function changeCount(amount) {
    count += amount;

    if (count === 0) {
        earnings = 0;
    } else {
        earnings += amount * 0.85;
    }

    updateDisplay();
}

function resetCount() {
    count = 0;
    earnings = 0;

    updateDisplay();
}

loadState();
updateDisplay();
</script>

</body>
</html>
